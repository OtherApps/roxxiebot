/* TOAST */
.toast {
  width: 300px;
    white-space: normal;
    overflow-wrap: break-word;
    word-break: break-word;
  padding: 30px;
  bottom:30px;
  background-image:url("./toasttemp2.png");
  border-radius: 25px;
  #background: linear-gradient(180deg, #3a0066 0%, #2a0050 40%, #0f3d2e 100%);
  border: 4px solid #39ff14;
  box-shadow: 0 0 20px #39ff14, inset 0 0 15px rgba(57,255,20,0.4);
  color: #39ff14;
 margin-left: -125px; 
  position: fixed;
  left: 50%;
  transform: translateX(-50%) translateY(100%); /* Hidden state */
  transition: transform 0.5s ease-in-out; /* Animation speed */
  opacity: 0;
  transition: all 0.4s ease;
  pointer-events: none;
  position:fixed;
 background-repeat: no-repeat; 

  
}

/* SHOW */
.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0) scale(1);
  pointer-events: auto;
  bottom:30px;
  
}

function timeConverter(UNIX_timestamp){
  var a = new Date(UNIX_timestamp * 1000);
  var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var year = a.getFullYear();
  var month = months[a.getMonth()];
  var date = a.getDate();
  var hour = a.getHours();
  var min = a.getMinutes();
  var sec = a.getSeconds();
  if(sec <10 ){
	sec ="0"+sec

  }
  if(hour <10) {
	hour = "0" + hour;

  }
  if(min <10){
	min = "0" + min

  }
  var time =   hour + ':' + min ;
  return time;
}

function processToastQueue() {
    if (toastShowing) return;
    if (toastQueue.length === 0) return;

    toastShowing = true;

    const data = toastQueue.shift();

    const toast = document.getElementById("toast");
    const username = document.getElementById("username");
    const pic = document.getElementById("pfp");
    const messagebox = document.getElementById("msg");

    username.textContent = data.name;
    messagebox.textContent = data.msg;
    pic.src = data.pfp;

    toast.classList.add("show");

    setTimeout(() => {
        hideToast();
    }, 8000);
}

function hideToast() {
    const toast = document.getElementById("toast");

    toast.classList.remove("show");

    // Wait for CSS animation to finish
    setTimeout(() => {
        toastShowing = false;
        processToastQueue();
    }, 500); // matches your CSS transition
}
